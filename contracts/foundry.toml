[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
# Pendle's deeply-nested LimitOrderData tuple overflows the legacy codegen stack; the IR pipeline
# encodes it cleanly. Standard for Pendle router integrations.
via_ir = true
[fmt]
line_length = 100
